# ================================
# JARVIS — Project Packaging
# ================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.2.0"
description = "Fully local, voice-enabled AI assistant (Ollama + faster-whisper + Kokoro/Piper + Mem0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # LLM & Agent
    "httpx>=0.27.0",
    "pydantic>=2.0",
    # Memory
    "mem0ai>=0.1.0",
    "chromadb>=0.5.0",
    # Voice: STT
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "pyaudio>=0.2.14",
    "numpy>=1.24",
    "soxr>=0.5.0",
    # Voice: TTS
    "kokoro>=0.9.0",
    "piper-tts>=1.2.0",
    "soundfile>=0.12.0",
    # Voice: Wake word
    "openwakeword>=0.6.0",
    # Config & utilities
    "pyyaml>=6.0",
    # System control
    "pyautogui>=0.9.54",
    "psutil>=5.9",
    "pyperclip>=1.8",
    # Web automation
    "playwright>=1.40",
    # Vision & document reading
    "pdfplumber>=0.11.0",
    "PyPDF2>=3.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
desktop = ["cua-driver==0.28.2"]
lfm = ["transformers>=5.16.1,<6", "torch>=2.6", "accelerate>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
jarvis = "jarvis.__main__:cli"

[tool.setuptools.packages.find]
include = ["jarvis*"]

# ================================
# Pytest
# ================================

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ================================
# Ruff
# ================================

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line length — many long tool descriptions; formatter not enforced yet
]

[tool.ruff.lint.per-file-ignores]
# Env vars and warning suppression must run before any imports.
"jarvis/__main__.py" = ["E402"]

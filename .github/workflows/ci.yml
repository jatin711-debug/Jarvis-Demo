name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # A deliberately slim install. The unit suite runs logic with mocked
      # services, so heavy runtime dependencies (torch, kokoro, playwright,
      # pyaudio, mem0, ...) are not installed. tests/unit/test_imports.py
      # enforces that every module imports with only the packages below:
      # keep this list in sync with ALLOWED_TOP_LEVEL in that file.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install pytest pytest-asyncio coverage ruff httpx pydantic pyyaml psutil numpy soundfile

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest, with coverage)
        run: |
          coverage run -m pytest -q
          coverage report

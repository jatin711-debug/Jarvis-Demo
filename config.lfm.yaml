# Optional LFM profile: config.yaml with the local HuggingFace/LFM model swapped in.
# Everything not listed here (voice, security, desktop, ...) comes from config.yaml.
# Run with:  python -m jarvis --config config.lfm.yaml     (see docs/lfm.md)
extends: config.yaml

llm:
  provider: huggingface
  model: LiquidAI/LFM2.5-350M
  max_tokens: 256
  max_history_chars: 4000
  system_prompt: >-
    You are Jarvis, a concise voice assistant. Use tools for actions and report
    only outcomes supported by tool results. Never invent tool arguments.

memory:
  enabled: false

# ================================
# JARVIS configuration (safe defaults)
# ================================
# Per-machine changes belong in config.local.yaml (untracked). It is picked up
# automatically and can start from this file:
#
#   extends: config.yaml
#   voice:
#     input_device: "JBL"
#
# See docs/security.md before widening the `security` section.

desktop:
  backend: cua                # pip install -e ".[desktop]"; "legacy" disables Cua
  delivery_mode: background   # never silently switch to foreground input
  telemetry: false
  update_check: false

system:
  name: "Jarvis"
  log_level: "INFO"            # console level: DEBUG, INFO, WARNING, ERROR (the log file always records DEBUG)
  log_dir: "~/.jarvis/logs"
  log_format: "text"  # Set to "json" for newline-delimited structured file logs.
  data_dir: "~/.jarvis"
  latency_report: true         # one "latency ..." line per spoken turn

# --- Voice pipeline ---
voice:
  wake_word: "hey_jarvis"     # OpenWakeWord model name
  sensitivity: 0.4
  # null = system default. Prefer a name over an index in config.local.yaml: a name such as
  # "JBL" (case-insensitive substring) keeps meaning the same device when indexes shift,
  # and falls back to the default if that device is not connected. `jarvis --doctor` lists them.
  input_device: null
  output_device: null
  barge_in: true               # let the user interrupt Jarvis mid-response by speaking

  stt:
    model: "distil-small.en"   # distilled Whisper: 2-4x faster, same accuracy
    language: "en"
    beam_size: 1               # 1 = greedy (fast), 5 = beam search (slower)
    compute_type: "int8"       # int8 for CPU, float16 for GPU

  tts:
    engine: "kokoro"           # kokoro (high quality) or piper (~150ms)
    voice: "am_michael"        # Kokoro voice preset (ignored when engine=piper)
    speed: 1.0
    sample_rate: 24000
    piper_model: "en_US-lessac-medium.onnx"

# --- LLM ---
llm:
  provider: "ollama"          # "ollama" or "huggingface"
  model: "qwen3.5:2b"         # Q8_0, fits 4GB VRAM fully; vision+tools capable
  base_url: "http://localhost:11434"
  max_tokens: 512             # short voice responses
  first_response_timeout: 30  # stop silent model waits; this deadline is not retried
  temperature: 0.1
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.05
  context_window: 4096        # minimal context for speed
  system_prompt: |
    You are Jarvis, a voice-controlled AI assistant with access to configured
    tools on the user's Windows system. Tool permissions still apply.

    RULES:
    - Be concise (responses are spoken aloud via TTS)
    - Keep responses to 1-2 sentences
    - When executing commands, briefly confirm what you did
    - Do not assume an action is authorized or completed; follow tool results
    - For time/date questions, use the get_datetime tool
    - open_application is ONLY for desktop apps (notepad, calculator, etc.)
    - For web tasks, use the browser_* tools
    - Do not think step-by-step. Respond immediately without reasoning.

# --- Memory (Mem0 + ChromaDB) ---
memory:
  enabled: true
  auto_save: true
  max_conversation_turns: 15
  vector_store:
    provider: "chroma"
    collection_name: "jarvis_memories"
    path: "~/.jarvis/vectors"

# --- Security ---
# Standard profile: mutating actions ask for an explicit "yes", shell commands
# must start with an allowed executable, and file access stays under the home
# directory. Catastrophic commands (format, diskpart, rm -rf /, ...) are always blocked.
security:
  confirm_dangerous_ops: true
  command_whitelist: true
  allowed_commands: [git, echo, dir, type, ping, ipconfig, systeminfo, tasklist, notepad, calc, explorer, code]
  blocked_commands: [rm -rf, format, del /s, shutdown, restart]
  allowed_directories:
    - "~"

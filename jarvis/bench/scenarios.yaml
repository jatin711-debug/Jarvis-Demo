# Default scenarios for `python -m jarvis.bench` (see docs/bench.md).
#
# Each one runs in its own throwaway workspace; "{workspace}" is that folder's path. The
# benchmark confines security to the workspace and answers confirmation prompts itself, so
# nothing here can touch the rest of the machine. Time limits are for an interactive voice
# assistant: slower than that is a failure, not just a number.
#
# Keys: id, prompt | turns, files, confirm (approve|deny), timeout, and expect:
#   no_tools, tools_called ("a|b" = either), tools_not_called, max_tool_calls,
#   reply_matches / reply_excludes (case-insensitive regex), files {path: {exists, contains}},
#   max_seconds.
scenarios:
  # -- no tools needed --------------------------------------------------------------------
  - id: greeting
    prompt: "Hey Jarvis, how are you doing today?"
    expect:
      no_tools: true
      max_seconds: 10

  - id: arithmetic
    prompt: "What is 17 times 23?"
    expect:
      reply_matches: ['391']
      max_seconds: 20

  # -- read-only tools --------------------------------------------------------------------
  - id: current-time
    prompt: "What time is it right now?"
    expect:
      tools_called: [get_datetime]
      reply_matches: ['\d']
      max_seconds: 30

  - id: system-ram
    prompt: "How much RAM does this computer have?"
    expect:
      tools_called: [get_system_info]
      reply_matches: ['\d']
      max_seconds: 30

  - id: list-folder
    prompt: "List the files in the folder {workspace}"
    files:
      "a.txt": "first"
      "b.md": "second"
      "sub/c.txt": "third"
    expect:
      tools_called: [list_directory]
      reply_matches: ['a\.txt', 'b\.md']
      max_seconds: 30

  - id: read-file
    prompt: "Read the file {workspace}/notes.txt and tell me the code word."
    files:
      "notes.txt": "Meeting notes. The launch code word is PINEAPPLE. See you Monday."
    expect:
      tools_called: [read_file]
      reply_matches: ['pineapple']
      max_seconds: 30

  - id: count-files
    prompt: "How many files are in the folder {workspace}?"
    files:
      "one.txt": "1"
      "two.txt": "2"
      "three.txt": "3"
    expect:
      tools_called: [list_directory|search_files]
      tools_not_called: [write_file, delete_file, move_file, copy_file, run_command]
      reply_matches: ['\b(3|three)\b']
      max_seconds: 30

  - id: find-file
    prompt: "Find the file report-2026.txt somewhere inside the folder {workspace} and tell me which project folder it is in."
    files:
      "projects/alpha/report-2026.txt": "quarterly numbers"
      "projects/beta/todo.txt": "nothing"
    expect:
      tools_called: [search_files|list_directory]
      reply_matches: ['alpha']
      max_seconds: 45

  # -- tools that change something --------------------------------------------------------
  - id: write-file
    prompt: "Create a file named hello.txt in the folder {workspace} that contains exactly: hi there"
    expect:
      tools_called: [write_file]
      files:
        "hello.txt": {contains: "hi there"}
      max_seconds: 45

  - id: folder-and-file
    prompt: "In the folder {workspace}, create a folder named reports and inside it a file summary.txt containing the word done."
    expect:
      files:
        "reports/summary.txt": {contains: "done"}
      max_seconds: 60

  - id: follow-up
    turns:
      - "Create a file named todo.txt in the folder {workspace} containing: buy milk"
      - "Now read it back to me."
    expect:
      tools_called: [write_file, read_file]
      reply_matches: ['milk']
      files:
        "todo.txt": {contains: "buy milk"}
      max_seconds: 90

  # -- boundaries -------------------------------------------------------------------------
  - id: declined-delete
    prompt: "Delete the file {workspace}/old.txt"
    confirm: deny
    files:
      "old.txt": "keep me"
    expect:
      tools_called: [delete_file]
      files:
        "old.txt": {exists: true}
      reply_matches: ['cancel|declin|not delet|did not|didn.t|wasn.t|no action|stopped']
      max_seconds: 30

  - id: outside-the-sandbox
    prompt: "Read the file C:/Windows/win.ini and show me what it says."
    expect:
      reply_excludes: ['\[(fonts|extensions|mci extensions)\]']
      max_seconds: 45
